name: Build mt7981 padavanonly/immortalwrt-mt798x-24.10

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
      
env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
      
    steps:
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt -yqq purge firefox
        sudo -E apt -yqq update
        sudo -E apt -yqq full-upgrade
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E systemctl daemon-reload
        sudo -E timedatectl set-timezone "Asia/Shanghai"
        
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL --depth=1 --single-branch --branch $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        echo "REPO_HEAD=$(git ls-remote $REPO_URL HEAD | head -c7)" >> $GITHUB_ENV
        #git reset --hard ee09cf9
        #echo "REPO_HEAD=ee09cf9" >> $GITHUB_ENV
        
        # GitHub Action 移除国内下载源
        PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
        if [ -f "$PROJECT_MIRRORS_FILE" ]; then
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
      
    - name: Install bluezalsa
      run: |
        cd openwrt
        wget -qO - https://github.com/raphikWasHere/bluealsa4openwrt/raw/main/bluez-alsa/packages/full.tar.gz | tar -zxvf - -C ./
        sed -i 's/4.1.1/4.3.1/g' ./feeds/packages/sound/bluez-alsa/Makefile
        sed -i 's/b69a3e6dd69315194403ee930ac1553aed3fb9a3988e502ae5c24a8bfef70f9f/933fe898dfac21fdfeb5f4ffa685c2aa2db9c064d639170ac2652f156e956a2a/g' ./feeds/packages/sound/bluez-alsa/Makefile
        rm -rf ./feeds/packages/sound/bluez-alsa/patches/
        ./scripts/feeds update
        ./scripts/feeds install bluez-alsa

    - name: Load custom config
      run: |
        cd openwrt

        # 使用默认配置
        rm -f .config

        make defconfig


        ########################################
        # Target: Xiaomi AX3000T AN8855
        ########################################

        cat >> .config <<'EOF'

CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y


########################################
# Full UBI image (NONMBM uboot)
########################################

CONFIG_TARGET_ROOTFS_UBIFS=y
CONFIG_TARGET_ROOTFS_SQUASHFS=n


########################################
# MTK proprietary WiFi driver
# MT7981 + AN8855
########################################

CONFIG_PACKAGE_kmod-mt_wifi=y
CONFIG_PACKAGE_mtwifi-cfg=y
CONFIG_PACKAGE_wifi-dats=y

CONFIG_MTK_MT_WIFI=m


########################################
# AP mode network support
########################################

CONFIG_PACKAGE_wpad-openssl=y

CONFIG_PACKAGE_hostapd-common=y

CONFIG_PACKAGE_kmod-cfg80211=y
CONFIG_PACKAGE_kmod-mac80211=y

CONFIG_PACKAGE_kmod-mediatek_hnat=y

CONFIG_PACKAGE_bridge-utils=y

CONFIG_PACKAGE_ebtables=y

CONFIG_PACKAGE_ethtool=y


########################################
# VLAN / Switch / AP bridge
########################################

CONFIG_PACKAGE_kmod-8021q=y
CONFIG_PACKAGE_kmod-gpio-button-hotplug=y

CONFIG_PACKAGE_ip-full=y


########################################
# DHCP AP mode utilities
########################################

CONFIG_PACKAGE_dnsmasq-full=y

CONFIG_PACKAGE_odhcp6c=y

CONFIG_PACKAGE_odhcpd-ipv6only=y


########################################
# LuCI
########################################

CONFIG_PACKAGE_luci=y

CONFIG_PACKAGE_luci-compat=y

CONFIG_PACKAGE_luci-app-firewall=y

CONFIG_PACKAGE_luci-app-opkg=y

CONFIG_PACKAGE_luci-app-wireless=y


########################################
# Argon Theme
########################################

CONFIG_PACKAGE_luci-theme-argon=y

CONFIG_PACKAGE_luci-app-argon-config=y


########################################
# Useful AP tools
########################################

CONFIG_PACKAGE_tcpdump=y

CONFIG_PACKAGE_iwinfo=y

CONFIG_PACKAGE_iw=y

CONFIG_PACKAGE_htop=y

EOF


        ########################################
        # Disable multi profile
        ########################################

        sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config


        ########################################
        # Generate final config
        ########################################

        make defconfig


        ########################################
        # Check device
        ########################################

        echo "===== DEVICE CHECK ====="

        grep "CONFIG_TARGET_DEVICE" .config || true

        echo "===== WIFI CHECK ====="

        grep "MT_WIFI" .config || true

        
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_padavanonly_bin_${{ env.REPO_HEAD }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_padavanonly_firmware_${{ env.REPO_HEAD }}
        path: ${{ env.FIRMWARE }}
        
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt_padavanonly_${{ env.REPO_HEAD }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "ImmortalWrt_padavanonly_${{ env.REPO_HEAD }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean Compile
      id: clean-compile
      run: |
        cd openwrt
        make clean

    - name: Cache Compile
      id: cache-compile
      uses: actions/cache/save@v4
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        path: openwrt
        key: ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/feeds.conf.default') }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3
