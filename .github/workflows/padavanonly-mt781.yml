name: Build AX3000T AN8855 ImmortalWrt 24.10

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai


jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write


    steps:


    - name: Checkout
      uses: actions/checkout@main


    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive

      run: |

        sudo rm -rf /usr/share/dotnet \
        /usr/local/lib/android \
        /opt/ghc \
        /opt/hostedtoolcache/CodeQL

        sudo -E apt update

        sudo -E apt install -y \
        dos2unix \
        python3-netifaces \
        libfuse-dev


        sudo bash -c \
        'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


        sudo mkdir -p /srcdir

        sudo chown $USER:$GROUPS /srcdir



    - name: Clone source code

      working-directory: /srcdir

      run: |

        git clone \
        --depth=1 \
        --single-branch \
        --branch $REPO_BRANCH \
        $REPO_URL openwrt


        ln -sf /srcdir/openwrt \
        $GITHUB_WORKSPACE/openwrt


        cd openwrt

        echo "REPO_HEAD=$(git rev-parse --short HEAD)" >> $GITHUB_ENV



    ################################################
    # Add Argon Theme
    ################################################


    - name: Add Argon Theme

      run: |

        cd openwrt

        git clone --depth=1 \
        https://github.com/jerrykuku/luci-theme-argon.git \
        package/luci-theme-argon



    ################################################
    # feeds
    ################################################


    - name: Update feeds

      run: |

        cd openwrt

        ./scripts/feeds update -a

        ./scripts/feeds install -a



    ################################################
    # Generate AX3000T config
    ################################################


    - name: Generate AX3000T config

      run: |

        cd openwrt


        rm -f .config


        cat > .config <<'EOF'


CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y

CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y


# FULL UBI
CONFIG_TARGET_ROOTFS_UBIFS=y
CONFIG_TARGET_ROOTFS_SQUASHFS=n



# MTK proprietary WIFI

CONFIG_MTK_MT_WIFI=m

CONFIG_PACKAGE_kmod-mt_wifi=y
CONFIG_PACKAGE_mtwifi-cfg=y
CONFIG_PACKAGE_wifi-dats=y



# AP networking

CONFIG_PACKAGE_wpad-openssl=y

CONFIG_PACKAGE_hostapd-common=y


CONFIG_PACKAGE_kmod-mediatek_hnat=y

CONFIG_PACKAGE_bridge-utils=y

CONFIG_PACKAGE_ebtables=y

CONFIG_PACKAGE_ethtool=y

CONFIG_PACKAGE_kmod-8021q=y


# IPv6 support

CONFIG_PACKAGE_odhcp6c=y

CONFIG_PACKAGE_odhcpd-ipv6only=y



# LuCI

CONFIG_PACKAGE_luci=y

CONFIG_PACKAGE_luci-compat=y

CONFIG_PACKAGE_luci-app-wireless=y

CONFIG_PACKAGE_luci-app-firewall=y


# Argon

CONFIG_PACKAGE_luci-theme-argon=y

CONFIG_PACKAGE_luci-app-argon-config=y



# tools

CONFIG_PACKAGE_iwinfo=y

CONFIG_PACKAGE_iw=y

CONFIG_PACKAGE_tcpdump=y

CONFIG_PACKAGE_htop=y


EOF



        make defconfig



    ################################################
    # Verify before compile
    ################################################


    - name: Verify configuration

      run: |

        cd openwrt


        echo "=============================="

        echo "DEVICE"

        echo "=============================="

        grep "CONFIG_TARGET_DEVICE" .config



        echo ""

        echo "=============================="

        echo "ROOTFS"

        echo "=============================="

        grep "CONFIG_TARGET_ROOTFS" .config



        echo ""

        echo "=============================="

        echo "MT WIFI"

        echo "=============================="

        grep "MT_WIFI" .config



        echo ""

        echo "=============================="

        echo "ARGON"

        echo "=============================="

        grep "argon" .config



        echo ""

        echo "=============================="

        echo "CHECK RESULT"

        echo "=============================="


        if ! grep -q \
        "xiaomi_mi-router-ax3000t=y" \
        .config

        then

          echo "ERROR: WRONG DEVICE"

          exit 1

        fi



        if ! grep -q \
        "CONFIG_TARGET_ROOTFS_UBIFS=y" \
        .config

        then

          echo "ERROR: NOT UBI IMAGE"

          exit 1

        fi


        echo "CONFIG OK"



    ################################################
    # Download
    ################################################


    - name: Download packages

      run: |

        cd openwrt

        make download -j8 V=s

        find dl -size -1024c -delete



    ################################################
    # Compile
    ################################################


    - name: Compile firmware

      id: compile

      run: |

        cd openwrt

        make -j$(nproc) || make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT



    - name: Upload firmware

      uses: actions/upload-artifact@main

      if: steps.compile.outputs.status == 'success'

      with:

        name: AX3000T-AN8855-UBI

        path: openwrt/bin/targets/mediatek/filogic/*


