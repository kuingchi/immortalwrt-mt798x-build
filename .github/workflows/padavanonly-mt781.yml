name: Build mt7981 padavanonly/immortalwrt-mt798x-24.10

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
      
env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
      
    steps:
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Verify required files
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/.github/workflows/mt7981-ax3000.config" ]; then
          echo "::error::找不到 $GITHUB_WORKSPACE/.github/workflows/mt7981-ax3000.config。请确认该文件已提交到仓库的 .github/workflows/ 目录下，文件名必须精确为 mt7981-ax3000.config"
          exit 1
        fi
        echo "OK: 找到 mt7981-ax3000.config"

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt -yqq purge firefox
        sudo -E apt -yqq update
        sudo -E apt -yqq full-upgrade
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E systemctl daemon-reload
        sudo -E timedatectl set-timezone "Asia/Shanghai"
        
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL --depth=1 --single-branch --branch $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt
        echo "REPO_HEAD=$(git ls-remote $REPO_URL HEAD | head -c7)" >> $GITHUB_ENV
        #git reset --hard ee09cf9
        #echo "REPO_HEAD=ee09cf9" >> $GITHUB_ENV
        
        # GitHub Action 移除国内下载源
        PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
        if [ -f "$PROJECT_MIRRORS_FILE" ]; then
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
      
    - name: Install ArgonTheme
      run: |
        cd openwrt
        git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon
        git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config

    - name: Load custom config
      run: |
        cd openwrt
        cp -f $GITHUB_WORKSPACE/.github/workflows/mt7981-ax3000.config .config
        sed -i 's/_mediatek_mt7981/_mediatek_filogic/g' .config
        # 基础防火墙/网络模块（AP 场景用得到，也为以后切回完整路由模式保留）
        echo "CONFIG_PACKAGE_kmod-nft-compat=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-fib=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-socket=y" >> .config
        echo "CONFIG_PACKAGE_kmod-netlink-diag=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-core=y" >> .config
        # 路由/NAT 相关模块：AP 模式下用不到，但保留以便以后当路由器用
        echo "CONFIG_PACKAGE_kmod-nft-nat=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-offload=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        # Argon 主题
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y" >> .config

    - name: Verify build config
      run: |
        cd openwrt
        make defconfig
        echo "==== Checking target device ===="
        DEVICE_COUNT=$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true)
        if [ "$DEVICE_COUNT" -ne 1 ]; then
          echo "::error::期望只选中 1 个目标设备，实际检测到 $DEVICE_COUNT 个，请检查 .config"
          grep '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config || true
          exit 1
        fi
        if ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y$' .config; then
          echo "::error::xiaomi_mi-router-ax3000t 未被选中，make defconfig 后该设备被丢弃了（可能是设备名拼写错误或依赖冲突），停止构建以免浪费时间"
          exit 1
        fi
        echo "==== Checking Argon theme packages ===="
        for pkg in CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_luci-app-argon-config; do
          if ! grep -q "^${pkg}=y$" .config; then
            echo "::error::${pkg} 未被启用，Argon 主题不会被编入固件"
            exit 1
          fi
        done
        echo "校验通过：仅构建 xiaomi_mi-router-ax3000t，且已包含 Argon 主题"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_padavanonly_bin_${{ env.REPO_HEAD }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_padavanonly_firmware_${{ env.REPO_HEAD }}
        path: ${{ env.FIRMWARE }}
        
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt_padavanonly_${{ env.REPO_HEAD }}" >> $GITHUB_OUTPUT
        touch release.txt
        echo "ImmortalWrt_padavanonly_${{ env.REPO_HEAD }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean Compile
      id: clean-compile
      run: |
        cd openwrt
        make clean

    - name: Cache Compile
      id: cache-compile
      uses: actions/cache/save@v4
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        path: openwrt
        key: ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/feeds.conf.default') }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3
